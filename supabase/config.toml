# Supabase CLI configuration.
#
# This governs `supabase start` — the local stack a contributor runs to apply
# migrations and regenerate `lib/database.types.ts`. It has no effect on a hosted
# project: those settings live in the Supabase dashboard.
#
# Deliberately trimmed. The CLI writes a much longer file with every option at
# its default; only the ones this project actually depends on are kept, so a
# reader can tell which values matter.

project_id = "evermind"

[api]
enabled = true
port = 54321
# `extensions` is on the search path because `moddatetime` lives there — Supabase
# keeps extensions out of `public`, and the `handle_updated_at` trigger calls it
# by qualified name.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match your hosted project. `supabase projects list` reports it.
major_version = 17

[studio]
enabled = true
port = 54323

# Catches outbound mail locally instead of sending it. The reminder function
# sends through Resend rather than Supabase, so this only covers auth mail.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Evermind is OAuth-only: there is no password or magic-link flow anywhere in the
# app. Local sign-up by email is left on so a contributor can create a test user
# without registering an OAuth app; a hosted project should leave it off.
[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
