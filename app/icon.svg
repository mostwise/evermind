<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Evermind">
  <!--
    The teal is the light-mode `--primary` from app/globals.css, oklch(0.55 0.15 180),
    written as hex because browser chrome renders favicons outside the page's colour
    context and oklch() support there is not something to rely on.

    Deliberately one mark rather than a light/dark pair. The rounded square carries its
    own background, so it reads on either browser theme, and a favicon that changes with
    the system theme is a thing users notice as a flicker rather than as a feature.

    The letterform is drawn as rectangles, not text: a <text> element in a favicon
    depends on a font being available in a context where none is guaranteed.
  -->
  <rect width="32" height="32" rx="7" fill="#0d9488"/>
  <g fill="#ffffff">
    <rect x="10" y="8" width="3.2" height="16" rx="1.2"/>
    <rect x="10" y="8" width="12" height="3.2" rx="1.2"/>
    <rect x="10" y="14.4" width="9" height="3.2" rx="1.2"/>
    <rect x="10" y="20.8" width="12" height="3.2" rx="1.2"/>
  </g>
</svg>
